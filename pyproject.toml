[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loglens"
version = "0.1.1"
description = "Turn mixed-format logs into a readable reconstruction of execution flow."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["drain3>=0.9.11"]

[project.optional-dependencies]
ai = ["sentence-transformers>=2.2", "rank-bm25>=0.2"]
dev = ["pytest>=7", "build>=1.0"]

[project.scripts]
loglens = "loglens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]

[tool.hatch.build.targets.sdist]
include = ["src/loglens", "README.md", "LICENSE", "pyproject.toml"]
